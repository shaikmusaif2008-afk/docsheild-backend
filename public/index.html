<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <title>DocShield AI — Security Command | AI Identity & Document Screening</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

      theme: {
        extend: {
          colors: {
            brand: {
              darkest: '#050811',
              dark: '#070b16',
              sidebar: '#070b14',
              surface: '#0d1424',
              surfaceHover: '#131e36',
              card: '#0c1322',
              border: '#152033',
              borderLight: '#1d2e4a',
              cyan: '#00f0ff',
              cyanGlow: '#0ea5e9',

              rose: '#f43f5e'

          }

      }
    }

  <!-- Chart.js -->

        <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
